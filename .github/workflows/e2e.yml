name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Run slow conversational specs (flavoralm/journey/foodlog)"
        required: false
        default: false
        type: boolean

env:
  DATABASE_URL: "file:./dev.db"

jobs:
  # Fast, deterministic browser specs (no FlavoraLM, no long chat loops).
  e2e-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_PROVIDER: heuristic
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npx prisma db push --schema prisma/schema.prisma --skip-generate
      - run: npm run db:seed
      - run: npx playwright test e2e/a11y.spec.ts e2e/keyboard.spec.ts e2e/navbar.spec.ts e2e/mobile.spec.ts e2e/critical.spec.ts --reporter=list
        working-directory: client

  # Offline / PWA sync (needs a production build for the service worker).
  e2e-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_PROVIDER: heuristic
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npx prisma db push --schema prisma/schema.prisma --skip-generate
      - run: npm run db:seed
      - run: npm run build --workspace=client
      - run: npx playwright test --config=playwright.offline.config.ts --reporter=list
        working-directory: client

  # Slow conversational specs (live chat loops, 120-300s each) run on demand,
  # not per push: `gh workflow run E2E --ref <sha> -f slow=true`.
  e2e-slow:
    if: inputs.slow == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_PROVIDER: heuristic
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npx prisma db push --schema prisma/schema.prisma --skip-generate
      - run: npm run db:seed
      - run: npx playwright test e2e/flavoralm.spec.ts e2e/journey.spec.ts e2e/foodlog.spec.ts --reporter=list
        working-directory: client
